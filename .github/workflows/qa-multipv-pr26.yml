name: QA multi-PV PR26
on:
  push:
    branches:
      - fix/step2-multi-pv-unique-households-20261104
      - integration/rc2-full-site
      - fix/step2-samsung-pv-address-20261106
  pull_request:
    branches:
      - fix/step2-poi-overpass-20261103
      - integration/rc2-full-site
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qa-multipv-pr26-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      # Reproducible install from package-lock.json (regenerated with the
      # npm 10.9 bundled with Node 22; it had been missing the Capacitor
      # dependencies added to package.json in 195821c).
      - name: Show toolchain
        run: node -v && npm -v
      - name: Install dependencies (clean, from lockfile)
        run: npm ci --no-audit --no-fund
      - name: Unique-households and PDF download tests
        run: node --import tsx --test tests/step2_multi_pv_unique_households.test.mjs tests/step4_pdf_direct_download.test.mjs
      - name: Complete official test suite
        id: full_suite
        run: npm test
      - name: Production build verification (no deploy)
        run: npm run build
      - name: Record test caveat
        if: always()
        run: |
          echo "### QA branch verification" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: \`$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Official suite outcome: \`${{ steps.full_suite.outcome }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "A passing job with full-suite failure is not full QA approval; inspect failed tests." >> "$GITHUB_STEP_SUMMARY"
