name: Validate public SEO changes

on:
  pull_request:
    branches:
      - 'integration/rc2-full-site'

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        # Il package-lock esistente non rispecchia package.json: npm ci fallisce prima dei test.
        # Installazione temporanea non bloccata per ottenere suite e build senza alterare il lockfile.
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Full test suite
        run: npm test
      - name: Build and SEO prerender
        if: always()
        run: npm run build

  baseline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout production baseline
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 22a54b3471739b29fa2c5d2721a03ee92997e701
          persist-credentials: false
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Run baseline suite for regression comparison
        run: npm test
