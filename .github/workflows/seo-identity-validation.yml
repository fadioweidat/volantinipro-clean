name: Validate public SEO changes

on:
  push:
    branches:
      - 'seo/identity-footer-piva-20261027'
  pull_request:
    branches:
      - 'integration/rc2-full-site'

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Full test suite
        run: npm test
      - name: Build and SEO prerender
        if: always()
        run: npm run build
