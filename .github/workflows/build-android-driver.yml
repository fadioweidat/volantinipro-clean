name: Build Android Driver APK

on:
  workflow_dispatch:
  push:
    branches:
      - integration/rc2-full-site
    paths:
      - 'src/**'
      - 'scripts/configure-capacitor-android.mjs'
      - 'capacitor.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-android-driver.yml'

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build web app
        run: npm run build

      - name: Create Android project
        run: |
          rm -rf android
          npx cap add android
          node scripts/configure-capacitor-android.mjs
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VolantiniPro-Driver-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
