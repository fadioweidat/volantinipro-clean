# Local-only Supabase configuration per il replay isolato di GPS PHASE 4
# (reconciliation delle RPC di sessione GPS). Nessun project ref, pooler URL
# o endpoint di produzione: solo porte locali dedicate per non collidere con
# altri stack locali gia' in esecuzione su questa macchina.

project_id = "volantinipro-gps-rpc-reconcile-local"

[api]
enabled = true
port = 54340
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54341
shadow_port = 54342
health_timeout = "2m"
major_version = 17

[db.pooler]
enabled = false
port = 54339
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = false
sql_paths = ["./seed.sql"]

[realtime]
enabled = false

[studio]
enabled = false
port = 54343
api_url = "http://127.0.0.1:54340"

[inbucket]
enabled = true
port = 54344

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://127.0.0.1:3000"]
jwt_expiry = 3600
enable_signup = true

[analytics]
enabled = false

# FASE Centro Controllo — persistenza config Edge Function (Blocco B).
# Questa e' l'unica supabase/config.toml del repository: pur essendo nata
# per il replay locale GPS PHASE 4 (vedi commento di testa del file), e'
# anche il file che "supabase functions deploy" legge per QUALUNQUE target
# (locale o --linked/--project-ref), incluso il progetto remoto reale.
#
# Senza questa sezione, un futuro "supabase functions deploy
# platform-health-collector" SENZA il flag --no-verify-jwt riattiverebbe
# verify_jwt=true di default (comportamento gia' osservato dal vivo in
# questa stessa fase: il primo deploy, senza questo flag, ha fatto fallire
# ogni chiamata schedulata dal cron con 401 UNAUTHORIZED_NO_AUTH_HEADER,
# perche' il gateway Supabase blocca la richiesta PRIMA che il codice della
# function (con la propria verifica x-collector-secret) venga mai eseguito).
# Dichiararlo qui rende il comportamento corretto riproducibile senza dover
# ricordare il flag ad ogni deploy futuro.
[functions.platform-health-collector]
verify_jwt = false

# Il configuratore Step1-4 è pubblico. L'Edge Function valida e minimizza il
# contesto applicativo internamente; un JWT valido abilita solo la cache utente.
[functions.ai-core]
verify_jwt = false
